<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <title>openEuler RISC-V package dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">openEuler 24.03 LTS SP3 · riscv64 · RVA23</p>
      <h1>Package readiness dashboard</h1>
      <p id="coverage-note">Loading observed package state…</p>
    </div>
    <a class="repo-link" href="https://github.com/yinjiayi/openeuler-riscv-packages">View repository</a>
  </header>

  <main>
    <section aria-labelledby="summary-title">
      <h2 id="summary-title">Current facts</h2>
      <div id="summary" class="cards"></div>
    </section>

    <section aria-labelledby="health-title">
      <h2 id="health-title">Daily update health</h2>
      <div id="update-health" class="health"></div>
    </section>

    <section aria-labelledby="packages-title">
      <div class="section-heading">
        <h2 id="packages-title">Managed packages</h2>
        <p id="result-count" aria-live="polite"></p>
      </div>
      <form id="filters" class="filters">
        <label>Status<select id="status-filter"><option value="">All</option></select></label>
        <label>Source<input id="source-filter" type="search" placeholder="arch, aur, fedora…"></label>
        <label>Version<select id="lag-filter"><option value="">All</option><option value="lag">Behind upstream</option><option value="current">Current</option></select></label>
        <label>Patches<select id="patch-filter"><option value="">All</option><option value="yes">Has patches</option><option value="no">No patches</option></select></label>
        <label>Failure<select id="failure-filter"><option value="">All</option></select></label>
        <label>Updated<select id="age-filter"><option value="">Any time</option><option value="1">24 hours</option><option value="7">7 days</option><option value="30">30 days</option></select></label>
        <button type="reset">Reset</button>
      </form>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Package</th><th>State</th><th>Version</th><th>Upstream</th><th>Sources</th><th>RISC-V</th><th>Patches</th><th>Last fact</th><th>Evidence</th></tr></thead>
          <tbody id="package-rows"></tbody>
        </table>
      </div>
      <p id="empty" class="empty" hidden>No packages match these filters.</p>
    </section>
  </main>
  <footer><p id="generated-at"></p><p id="snapshot-note"></p></footer>
  <script src="app.js" defer></script>
</body>
</html>

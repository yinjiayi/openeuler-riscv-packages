# This file is included from http{}, not from inside a server block.
# A missing generation may appear after publication; errors are not immutable.
map $status $openeuler_rpmrepo_generation_cache_control {
    default "no-store";
    200 "public, max-age=31536000, immutable";
    206 "public, max-age=31536000, immutable";
    304 "public, max-age=31536000, immutable";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/openeuler-riscv-rpm-repo/public;
    charset utf-8;
    autoindex on;
    default_type application/octet-stream;
    # Also covers the hidden-file deny location and early server errors.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        autoindex off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /state.json {
        autoindex off;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /generations/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control $openeuler_rpmrepo_generation_cache_control always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ /\. {
        deny all;
    }
}

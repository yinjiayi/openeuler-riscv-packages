    "notes": "The official non-prerelease SDL_image 2.8.12 release asset was independently downloaded and matched both the committed SHA-256 and the upstream GitHub release asset digest, then passed single-root path/link archive inspection. No cryptographic signature verification is claimed for the current release; sources.yaml records no detached signature. Frozen Ubuntu GA metadata supplies the historical inventory lineage; no distribution recipe was read or executed. The fixed target repository supplies SDL2, SDL2-static for the upstream SDL2test-linked test executable, and JPEG, PNG, TIFF, and WebP development packages, while AVIF and JPEG XL development providers are absent. SDL2-static is build-only and is not propagated to either output RPM. The build therefore keeps every portable built-in backend plus strict system JPEG/PNG/TIFF/WebP support and runs the complete registered upstream test executable with its shipped fixtures. Version 2.8.12 Release 2 aligns installed smoke with the current version and keeps it within the produced RPM dependency closure: it compiles, links, and runs the installed pkg-config interface and decodes a PNG, while the complete upstream build-time test suite remains unchanged.",

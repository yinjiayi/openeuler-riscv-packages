    "notes": "Official GNU 2.2.1 release bytes are SHA-256 pinned; libwget.so.4 is preserved and the complete serial suite remains enabled with local HTTP and TLS test dependencies. Test-suite diagnostics are emitted when that complete suite fails. Release 3 retains optional libproxy discovery while giving explicit libwget and command-line proxy settings precedence, after exact-head CI showed three IDN tests bypassing their local proxy and attempting DNS resolution. Release 4 packages the installed Wget2 manual and removes the upstream test-only wget2_noinstall helper from the runtime image after exact-head CI completed all 83 tests but rejected those two unpackaged files. AUR was read-only RPC metadata only; no external packaging content was executed.",

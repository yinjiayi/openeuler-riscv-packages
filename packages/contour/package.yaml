    "notes": "Selected from the full discovery inventory; the exact official GitHub stable tag archive was independently downloaded, safety-inspected, checked for a top-level license file and supported build system, and pinned by SHA-256. Release 2 declares the upstream platform development dependencies, uses openEuler's compatible Freetype provider instead of the unavailable Savannah download, and enables Contour's real CTest suite with CONTOUR_TESTING. Exact-head trusted Package CI run 34114949987 installed the declared dependencies and reached CMake, where the Linux GUI path failed because Qt6WaylandClient and XKB were unavailable. Release 3 adds the checksum-verified openEuler 24.03 LTS SP3 RVA23 providers qt6-qtwayland-devel, libxkbcommon-devel, and wayland-devel. Run 34117613325 proved those providers installed, then exposed that openEuler Qt 6.5 exports Qt6::WaylandClientPrivate through the public WaylandClient component rather than a separate private component config. Release 4 applies that packaging compatibility while retaining Wayland, protocol generation, CONTOUR_TESTING, and the complete CTest invocation. Run 34119474592 verified that configuration then failed because the exported target referenced QtCore's versioned private include directory, which is shipped separately by the official qt6-qtbase-private-devel package; Release 5 declares that matching provider. Exact-head trusted run 34120864607 then installed the full declared dependency closure, configured successfully, and compiled steadily to 56 percent without a compiler, linker, dependency, or QEMU error before the 60-minute package deadline stopped rpmbuild. Release 6 raised the package deadline to 120 minutes. Exact-head ordinary run 34127459923 again verified the dependency closure and RVA23 environment and compiled without errors to 65 percent, but dependency preparation left only 4,852 seconds for rpmbuild. Release 7 raises only the total package budget to 240 minutes so the complete GUI, Wayland build, and CTest suite retain sufficient execution time. Exact-head ordinary run 34232036793 compiled the fetched yaml-cpp 0.8.0 provider but failed when ContourTerminalDisplay compiled Config.h without yaml-cpp's include path. Release 8 links that display target to the already selected yaml-cpp target so its usage requirements reach compilation, preserving the namespaced/legacy provider selection, GUI, Wayland, all CTest checks, and the 240-minute budget.",

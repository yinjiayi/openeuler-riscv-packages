    "notes": "Selected from the full discovery inventory; the exact official GitHub stable tag archive was independently downloaded, safety-inspected, checked for a top-level license file and supported build system, and pinned by SHA-256. Downstream release 2 matches the SPEC source root to the archive's exact julius-4.6 top-level directory. Exact-head CI run 33673195508 for release 2 reached compilation and failed because upstream includes GCC's x86-only cpuid.h on RISC-V even though no x86 SIMD implementation is enabled. Release 3 restricts that header to x86 targets, preserving the scalar DNN implementation and build features. Exact-head run 33676018135 verified the release 3 source and dependencies, then failed first in %prep because strict GNU patch could not apply the hand-written hunk. Release 4 regenerates the semantically unchanged hunk with standard three-line unified-diff context; it applies to the verified archive with GNU patch and fuzz disabled. Exact-head run 33678330024 for release 4 applied that patch and compiled on RISC-V until libsent/src/phmm/calc_dnn.c used omp_get_max_threads and omp_get_thread_num without declarations. Configure had enabled OpenMP with -fopenmp, but upstream nested omp.h inside a SIMD-only conditional that is false on RISC-V. Release 5 includes omp.h whenever _OPENMP is defined while preserving OpenMP and scalar DNN behavior. Exact-head run 33682226324 at a44dc56ad2be5472e59afa62918ed0e6fafb65b4 applied both source fixes and completed compilation, then %make_install wrote every file under the build container's /usr because upstream's recursive Makefiles ignore DESTDIR. The RPM buildroot remained empty and the explicit nonempty-manifest check failed. Release 6 imports Fedora's checksum-pinned Julius 4.6 DESTDIR patch so the same complete upstream install target stages files in the RPM buildroot. Exact-head run 33685567655 at 6ea2085f8ef6a63891fd89405bdfcc597dd4a319 completed compilation and staged installation, then failed in %check because the upstream top-level Makefile defines no check target. Source audit found no registered top-level test suite; the only check-named target under the configured source tree is an empty libjcode build alias. Release 7 replaces the invalid command with deterministic checks that execute the built Julius decoder's documented help path, assert its documented exit status and stable output, and verify both generated library configuration reporters. No source feature or patch is changed. The RISC-V build status remains unknown pending fresh exact-head CI evidence for release 7.",

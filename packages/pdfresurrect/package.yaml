    "notes": "Highest official numeric stable tag v0.23, not a formal release; main.h VER and ChangeLog confirm 0.23. All 13 original source files/modes and complete configure FSF unlimited-copy/modify grants are retained as raw notices. One pinned package-local patch changes only the two configure inputs to preserve incoming CFLAGS during compiler probes; 11 source files remain original and two postpatch digests are verified at prep/build/check. Original make all builds one binary and supplied manual; no upstream test target or fixtures exists. Additive six semantic groups run ten exact CLI cases in build and installed roles. Extraction retains the full original bytes plus selected startxref trailer; it is not scrubbing. Experimental scrub remains disabled. Target ELF64/RISC-V and build-ID, same-file installed binary and helper/raw-output hashes are actual CI gates, not a present repaired-target acceptance claim. No security, performance, rendering, all-PDF, native or full-Daily claim."

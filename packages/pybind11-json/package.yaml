    "notes": "Selected from the full discovery inventory; the official upstream release archive was independently downloaded, safety-inspected, checked for a top-level license file and supported build system, and pinned by SHA-256. The package uses the distribution pybind11, nlohmann-json3, GTest, and Python development providers and runs the upstream executable test suite. Release 3 uses openEuler's out-of-source CMake configure macro so the configure, build, install, and test helpers share the same build directory. Release 4 marks the installed header-only CMake package as noarch; its target build produced RPM and SRPM artifacts and passed all 29 upstream tests, but installed consumer compilation exposed the missing Python development header dependency. Release 5 requires python3-devel for installed pybind11_json consumers. Release 6 pins immutable upstream commit 32043f433ed987b2c2ce99d689ec337bcbd4ba95 with full archive/Git blob equality and unchanged upstream contents, adapts the exact source root, and refreshes onto current protected official-metadata-cache infrastructure after the latest release-5 dependency preparation timeout. The existing 3600-second dependency cap, full upstream suite and installed C++/Python consumer are not weakened. The current image verification succeeded on main; no separate cache JSON is exported and fresh release-6 target CI/product/publication acceptance remains pending. External distribution packaging was not executed.",

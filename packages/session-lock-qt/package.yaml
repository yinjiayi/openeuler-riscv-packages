    "notes": "Selected from the full discovery inventory; the exact official GitHub stable tag archive was independently downloaded, safety-inspected, checked for a top-level license file and supported build system, and pinned by SHA-256. Downstream release 2 matches the archive's qt-session-lock-2.1.0 source root, declares the fixed-repository Qt 6 and Wayland development providers, and installs the QML module under the target architecture's library directory. Exact-head trusted run 34029100753 proved those providers install and then failed because upstream requests WaylandClientPrivate as a separate Qt component. Contour runs 34117613325 and 34119474592 established that openEuler Qt 6.5 exports Qt6::WaylandClientPrivate through the public WaylandClient component and that its versioned QtCore private headers come from qt6-qtbase-private-devel. Release 3 applies the same compatibility, retains the private target and Wayland functionality, declares libxkbcommon-devel, and checks that the upstream sessionlock-test executable is built. The source digest is unchanged and external distribution packaging was not executed.",

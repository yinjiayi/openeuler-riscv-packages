    "notes": "Frozen Debian 1.08-3 maps to official stable CPAN Time-Tiny 1.08. Publisher CHECKSUMS matches the fixed HTTPS archive. Installed PM, README and LICENSE directly grant same-as-Perl redistribution by Adam Kennedy; no vendored code or contrary default-test notice. Official SP3 RVA23 primary has no collision and supplies all required providers, including DateTime/Locale/TimeZone for the optional test branch. Initial exact-head target run 37061993495 failed only original t/02_main.t locale assertion 11: DateTime::Locale 1.35 maps C to en-US, not the old en-US-POSIX expected by its version heuristic. A narrow package-local patch preserves both default files, all 16 assertions and zero skips while adding a concrete 1.35 expectation; original 1.25 branch remains en-US-POSIX. Target CI must prove the repaired full suite, physical products and installed time-object roundtrip; DateTime remains optional at runtime."

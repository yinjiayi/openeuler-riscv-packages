    "notes": "Selected from the full discovery inventory. Downstream release 2 declares the pkg-config, OpenSSL, JSON-C, libcurl, UUID, and cmocka providers required by the default build and unit tests. Release 3 switches from GitHub's tag snapshot to upstream's official GNU-style 4.1.3 release asset, which includes VERSION, src_vars.mk, configure, and Makefile.in, and pins its independently recomputed SHA-256. Release 4 adds the OpenSSL command-line package used by the enabled unit suite to decode its test fixtures; the existing openssl-devel dependency remains for compilation. Release 5 lists manual pages separately from the generated payload manifest so RPM's post-install compression cannot invalidate their names. Upstream also publishes a detached signature whose issuer fingerprint is recorded as advisory metadata; the signature was not cryptographically verified here. Integration tests remain at their upstream default because they require a TPM simulator and additional integration infrastructure; no library or TCTI feature is disabled. External distribution packaging was not executed, and the RISC-V build status remains unknown pending fresh CI evidence.",

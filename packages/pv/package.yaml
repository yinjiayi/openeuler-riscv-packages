    "notes": "Official Codeberg v1.11.0 tag bytes are SHA-256 pinned. All 52 upstream checks run with valgrind and tmux available; the check HOME prevents user shell configuration from contaminating tmux's detached-width probe. Exact-name AUR RPC returned no result and no external packaging recipe was read or executed. Exact-head Package CI run 33704850223 at 1d6b4f7fb6150570cc16192afae7e3314fed8c82 compiled and installed successfully, had 10,258 seconds of build budget remaining, and passed 47 of 52 checks. The five failures were exactly the five tests that source tests/run-valgrind.sh. Release 2 run 33707672244 at cbaff73805392e1fdc0e5d17e82c99db297bd30c reproduced those failures with 10,279 seconds remaining. Its retained Automake logs contained only status 1 and no valgrind.out because upstream deletes the temporary workFile4 log for every result other than the configured memory-error status 125. Release 3 keeps all tests and Valgrind enabled and preserves every failure status while a downstream diagnostic-only patch emits at most 2,000 lines of that temporary log for any nonzero result.",

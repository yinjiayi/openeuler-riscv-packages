    "maintainers": ["yinjiayi"],
    "notes": "Official pixman 0.46.4 stable release bytes are SHA-256 pinned and also match the upstream SHA-512. Arch stable, openSUSE Tumbleweed, and Ubuntu GA corroborate 0.46.4; Fedora 44 and Debian stable provide older reviewed baselines. The committed discovery snapshot's only AUR match was the stale pixman-git VCS entry, so it was excluded by the pre-release and 24-month policies. A supplemental AUR RPC query was metadata-only; no AUR recipe or distribution spec was executed. Exact-head run 33723149338 built four binary RPMs and one SRPM and passed all 35 upstream Meson tests, then exposed a smoke-source defect because NULL was used without its standard definition. Release 2 adds the missing stddef.h include without changing the package build or runtime API exercise. Exact-head run 33727184465 passed 33 tests with zero failures or skips, but shared-runner contention pushed composite and tolerance-test beyond the 1,200-second per-test limit; both had passed in 944 and 909 seconds in run 33723149338. Release 3 raises only the Meson timeout multiplier from 10 to 20 while retaining every test, its inputs, four-way execution, and the 180-minute package deadline.",

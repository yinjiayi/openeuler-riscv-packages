    "notes": "Selected from the full discovery inventory; the exact official GitHub stable tag archive was independently downloaded, safety-inspected, checked for a top-level license file and supported build system, and pinned by SHA-256. The declared build requirements include the GIMP 3 and GLib development interfaces required by the upstream Meson build. Exact-head run 33362605060 resolved the complete 328-package dependency transaction, but the former 60-minute budget expired during downloads at package 114 before rpmbuild began. Release 3 raised the package timeout to 180 minutes. Exact-head run 33719340367 then completed that dependency transaction and exposed a deterministic prep failure because the upstream tag archive uses resynthesizer-3.0.1 rather than the downstream package name as its top-level directory. Release 4 selected that verified directory and enabled the upstream testHealLib harness. Exact-head run 33721116347 reached the build and exposed missing Pixelel and Coordinates definitions in upstream's optional libheal translation unit. Release 5 adds those direct type-header dependencies in the same order already used by upstream engine.c, executes testHealLib explicitly, and requires all eight reachable scenarios to run. Exact-head run 33722153814 compiled all 34 targets and then proved that v3.0.1's custom translation copy ignored RPM's DESTDIR. Release 6 keeps both the generated catalog source and every per-plugin destination inside the buildroot, equivalent to the target-root handling added later by upstream commit f38a155f9168a29460380642b4f1cbcc81a5186b. Exact-head run 33723518309 confirmed the DESTDIR fix, then showed that upstream gates entry to its test subdirectory on install-test even when build-libheal is enabled. Release 7 enables those upstream CI/developer targets, removes their installed payload before runtime file-list generation, and retains the strict build-tree testHealLib execution. Exact-head run 33724934486 materialized that harness and exposed the incomplete libheal source list through undefined map, coordinate, target, bounds, and statistics symbols. Release 8 adds the same six support implementations already compiled into libresynthesizer without weakening the functional runtime gate. Exact-head run 33726379894 exposed a one-line hunk-header offset that Apple's patch accepted but RPM's GNU patch rejected under fuzz zero; Release 9 aligns that hunk and is verified with the same GNU no-fuzz command. External distribution packaging was not executed, and the RISC-V build status remains unknown pending fresh exact-head build and installed-smoke evidence.",

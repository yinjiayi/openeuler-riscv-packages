    "notes": "Selected from the full discovery inventory. Exact-head Package CI run 33672605181 proved that upstream 4.3 requires GTK >= 4.14, while the immutable openEuler 24.03 LTS SP3 repository metadata supplies GTK 4.10.5 and libadwaita 1.3.4. Stable releases 4.1 and 4.2 require libadwaita >= 1.4, so 4.0 is the newest stable release compatible with the fixed target stack: it requires GTK >= 4.0 and GLib >= 2.58 and has no libadwaita dependency. Its official GitHub tag archive was independently downloaded, safety-inspected, verified to contain the GPL-3.0-or-later license and a single parlatype-4.0 source root, and pinned by SHA-256. Release 3 declares every provider used directly by the default build, complete Meson test suite, translations, installed help, and required runtime data/plugins. Exact-head Package CI run 33674786657 built and installed release 3, then all five non-device tests passed while GTK's config and waveviewer tests lacked a display and the player test lacked an audio device. Release 4 keeps all eight Meson tests enabled and provides deterministic Xvfb and ALSA null-device test fixtures. Exact-head Package CI run 33677469018 at a92438ae88f8f5a296fe330a587789adab61b7ac built and installed release 4, then stopped in %check because prefixing the multiline %meson_test RPM macro left xvfb-run without a child command. Release 5 passes the target macro's complete Meson test command and parallel/error-reporting options explicitly to Xvfb. Exact-head Package CI run 33680210823 at f3991ef257efc00980b6489189821d9d5c857a25 built and installed release 5 and passed seven of eight Meson tests; waveviewer alone terminated with SIGTRAP after GTK could not execute dbus-launch to acquire a session bus. Release 6 adds the official dbus-x11 test provider, whose checksum-verified target filelists metadata contains /usr/bin/dbus-launch. Optional GIR, gtk-doc, PocketSphinx, and DeepSpeech features retain their upstream-disabled defaults; no test is skipped. Fresh exact-head target CI remains authoritative.",

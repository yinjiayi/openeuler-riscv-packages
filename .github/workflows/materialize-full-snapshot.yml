name: Materialize reviewed full catalog snapshot

on:
  push:
    branches:
      - infra/full-catalog-reviewed-cohort

permissions:
  contents: write

jobs:
  materialize:
    if: "${{ github.event.head_commit.message == 'infra: stage full catalog snapshot' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: infra/full-catalog-reviewed-cohort
          fetch-depth: 0

      - name: Reassemble and verify immutable snapshot
        shell: bash
        run: |
          set -euo pipefail
          target='catalog/snapshots/discovery-20260808T165000Z-9a89920c269462cd.json.gz'
          test ! -e "${target}"
          test "$(find .snapshot-upload -type f | wc -l)" -eq 28
          cat .snapshot-upload/part-* > "${target}"
          test "$(wc -c < "${target}")" -eq 20926425
          printf '%s  %s\n' 'bd79d0cd34f3d674c10736aa83d8f9f78f35531ae99cef53663b62bc74458fe0' "${target}" | sha256sum -c -
          find .snapshot-upload -type f -delete
          rmdir .snapshot-upload
          rm .github/workflows/materialize-full-snapshot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --exit-code && exit 1
          git commit -m 'infra: materialize full catalog snapshot'
          git push origin HEAD:infra/full-catalog-reviewed-cohort

# SPDX-License-Identifier: Apache-2.0
name: Dashboard

on:
  push:
    branches: [main]
    paths:
      - packages/**
      - catalog/**
      - dashboard/**
      - scripts/generate-dashboard
      - ci/collect-dashboard-evidence.py
      - ci/collect-github-state.sh
      - ci/collect-github-state.py
      - ci/collect-build-history.py
      - ci/collect-published-state.py
      - ci/validate-dashboard-output.py
      - schemas/build-history.schema.json
      - schemas/dashboard-published-state.schema.json
      - .github/workflows/dashboard.yml
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: github-pages-dashboard
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Configure GitHub Pages metadata
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install pinned collector validation dependencies
        run: python3 -m pip install 'jsonschema==4.25.1' 'rfc3339-validator==0.1.4' 'rfc3986-validator==0.1.1'
      - name: Collect current PR and Actions facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/dashboard artifacts/build-results public
          ci/collect-github-state.sh artifacts/dashboard/github-state.json
          latest=$(gh run list --workflow daily-update-check.yml --limit 1 \
            --json databaseId,status --jq '.[0].databaseId // empty')
          if [[ -n $latest ]]; then
            gh run download "$latest" --name daily-update-summary \
              --dir artifacts/latest-update || true
          fi
          python3 ci/collect-dashboard-evidence.py \
            --output-dir artifacts/build-results \
            --result artifacts/dashboard/evidence-collection.json
      - name: Refresh durable exhaustive available build history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 ci/collect-build-history.py --repository "$GITHUB_REPOSITORY" \
            --repo-root . --raw-dir work/dashboard-private/history \
            --seed dashboard/build-history-ledger.json \
            --published-seed-url https://yinjiayi.github.io/openeuler-riscv-packages/build-history-ledger.json \
            --output artifacts/dashboard/build-history-ledger.json --workers 6 --max-requests 4000
          result=$?
          set -e
          # Exit 2 is an explicit schema-valid lower bound, not full history.
          # Missing durable seed or unexpected failure must block deployment.
          [[ $result == 0 || $result == 2 ]]
          test -s artifacts/dashboard/build-history-ledger.json
      - name: Verify fixed published repository generation
        run: |
          python3 ci/collect-published-state.py --repo-root . \
            --output artifacts/dashboard/published-state.json --workers 6
      - name: Generate factual static dashboard
        run: |
          args=(
            --repo-root .
            --output-dir public
            --github-state artifacts/dashboard/github-state.json
            --build-results artifacts/build-results
            --build-history artifacts/dashboard/build-history-ledger.json
            --published-state artifacts/dashboard/published-state.json
            --package-inventory catalog/package-index.json.gz
            --output artifacts/dashboard/generator-result.json
          )
          if [[ -s artifacts/latest-update/update-summary.json ]]; then
            args+=(--update-summary artifacts/latest-update/update-summary.json)
          fi
          scripts/generate-dashboard "${args[@]}"
      - name: Validate every generated Pages JSON asset
        run: |
          python3 ci/validate-dashboard-output.py --output-dir public \
            --published-state artifacts/dashboard/published-state.json \
            --output artifacts/dashboard/output-validation.json
      - name: Upload dashboard generation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-evidence-${{ github.run_id }}
          path: artifacts/dashboard/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

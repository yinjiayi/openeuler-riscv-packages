# SPDX-License-Identifier: Apache-2.0
name: Dashboard

on:
  push:
    branches: [main]
    paths:
      - packages/**
      - catalog/**
      - dashboard/**
      - scripts/generate-dashboard
      - ci/collect-github-state.sh
      - .github/workflows/dashboard.yml
  workflow_run:
    workflows: [Package CI, Daily Update Check, Update Schedule Monitor]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: github-pages-dashboard
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Configure GitHub Pages metadata
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Collect current PR and Actions facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/dashboard artifacts/build-results public
          ci/collect-github-state.sh artifacts/dashboard/github-state.json
          latest=$(gh run list --workflow daily-update-check.yml --limit 1 \
            --json databaseId,status --jq '.[0].databaseId // empty')
          if [[ -n $latest ]]; then
            gh run download "$latest" --name daily-update-summary \
              --dir artifacts/latest-update || true
          fi
      - name: Generate factual static dashboard
        run: |
          args=(
            --repo-root .
            --output-dir public
            --github-state artifacts/dashboard/github-state.json
            --build-results artifacts/build-results
            --output artifacts/dashboard/generator-result.json
          )
          if [[ -s artifacts/latest-update/update-summary.json ]]; then
            args+=(--update-summary artifacts/latest-update/update-summary.json)
          fi
          scripts/generate-dashboard "${args[@]}"
      - name: Upload dashboard generation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-evidence-${{ github.run_id }}
          path: artifacts/dashboard/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0


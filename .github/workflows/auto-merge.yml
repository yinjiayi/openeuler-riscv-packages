# SPDX-License-Identifier: Apache-2.0
name: Auto Merge Policy

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited, labeled, unlabeled]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  configure:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.author_association == 'OWNER' ||
       github.event.pull_request.author_association == 'MEMBER' ||
       github.event.pull_request.author_association == 'COLLABORATOR' ||
       github.event.pull_request.user.login == 'yinjiayi' ||
       github.event.pull_request.user.login == 'github-actions[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Disarm GitHub Auto-merge before evaluating the current head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          disable_result=0
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto \
            >"$RUNNER_TEMP/disable-auto.log" 2>&1 || disable_result=$?
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          if ! jq -e \
              --arg repo "$GITHUB_REPOSITORY" \
              --arg head "$EVENT_HEAD_SHA" \
              --arg base "$EVENT_BASE_SHA" \
              --arg base_ref "$EVENT_BASE_REF" \
              '.state == "open" and
               .merged == false and
               .merged_at == null and
               .head.sha == $head and
               .base.sha == $base and
               .base.ref == $base_ref and
               .head.repo.full_name == $repo and
               .base.repo.full_name == $repo and
               .auto_merge == null' <<<"$current" >/dev/null; then
            cat "$RUNNER_TEMP/disable-auto.log" >&2
            printf 'Unable to prove the mandatory Auto-merge disarm state.\n' >&2
            exit 1
          fi
          if (( disable_result != 0 )); then
            printf 'Disable command returned %d, but API readback proves auto-merge is off.\n' \
              "$disable_result"
          fi
      - name: Bind the current base to the repository default branch
        id: protected_base
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$EVENT_HEAD_SHA" \
            --arg base "$EVENT_BASE_SHA" \
            --arg base_ref "$EVENT_BASE_REF" \
            '.state == "open" and
             .merged == false and
             .merged_at == null and
             .head.sha == $head and
             .base.sha == $base and
             .base.ref == $base_ref and
             .head.repo.full_name == $repo and
             .base.repo.full_name == $repo and
             .auto_merge == null' <<<"$current" >/dev/null
          repository=$(gh api "repos/$GITHUB_REPOSITORY")
          jq -e '.default_branch == "main"' <<<"$repository" >/dev/null
          default_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main")
          jq -e \
            '.ref == "refs/heads/main" and
             .object.type == "commit" and
             (.object.sha | type == "string" and test("^[0-9a-f]{40}$"))' \
            <<<"$default_ref" >/dev/null
          default_head=$(jq -r .object.sha <<<"$default_ref")
          if [[ "$EVENT_BASE_REF" == main && "$EVENT_BASE_SHA" == "$default_head" ]]; then
            printf 'protected=true\n' >>"$GITHUB_OUTPUT"
          else
            printf 'protected=false\n' >>"$GITHUB_OUTPUT"
            printf 'PR base is not the current protected main head; Auto-merge remains disarmed.\n'
          fi
      - name: Check out the immutable protected-base policy
        if: steps.protected_base.outputs.protected == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Evaluate exact current scope from complete API file evidence
        id: policy
        if: steps.protected_base.outputs.protected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [[ ! -x ci/evaluate-auto-merge.py ]]; then
            jq -n \
              --arg head "$EVENT_HEAD_SHA" \
              --arg base "$EVENT_BASE_SHA" \
              '{
                schema_version: 1,
                status: "blocked",
                eligible: false,
                package_id: "",
                head_sha: $head,
                base_sha: $base,
                changed_files: [],
                reasons: ["protected-base policy predates evaluator"]
              }' >"$RUNNER_TEMP/auto-merge-policy.json"
            printf 'eligible=false\npackage_id=\n' >>"$GITHUB_OUTPUT"
            jq . "$RUNNER_TEMP/auto-merge-policy.json"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            >"$RUNNER_TEMP/auto-merge-pr.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            >"$RUNNER_TEMP/auto-merge-files.json"
          ci/evaluate-auto-merge.py \
            --pr-json "$RUNNER_TEMP/auto-merge-pr.json" \
            --files-json "$RUNNER_TEMP/auto-merge-files.json" \
            --repo "$GITHUB_REPOSITORY" \
            --event-head "$EVENT_HEAD_SHA" \
            --event-base "$EVENT_BASE_SHA" \
            --output "$RUNNER_TEMP/auto-merge-policy.json" \
            --github-output "$GITHUB_OUTPUT"
          jq . "$RUNNER_TEMP/auto-merge-policy.json"
      - name: Prove the live required-context barrier is active
        id: activation
        if: >-
          steps.protected_base.outputs.protected == 'true' &&
          steps.policy.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result=0
          ci/prove-required-context-active.py \
            --repository "$GITHUB_REPOSITORY" \
            --context configure \
            --ruleset-config .github/rulesets/main.json \
            >"$RUNNER_TEMP/auto-merge-activation.json" || result=$?
          cat "$RUNNER_TEMP/auto-merge-activation.json"
          case $result in
            0) printf 'activated=true\n' >>"$GITHUB_OUTPUT" ;;
            3) printf 'activated=false\n' >>"$GITHUB_OUTPUT" ;;
            *) exit "$result" ;;
          esac
      - name: Arm GitHub Auto-merge only after the live barrier is active
        if: >-
          steps.protected_base.outputs.protected == 'true' &&
          steps.policy.outputs.eligible == 'true' &&
          steps.activation.outputs.activated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          armed_verified=false
          rollback_unverified_auto_merge() {
            result=$1
            trap - EXIT
            if [[ "$armed_verified" != true ]]; then
              set +e
              gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto \
                >"$RUNNER_TEMP/rollback-auto-merge.log" 2>&1
              disable_result=$?
              ci/prove-auto-merge-state.py \
                --repo "$GITHUB_REPOSITORY" \
                --pr-number "$PR_NUMBER" \
                --event-head "$EVENT_HEAD_SHA" \
                --event-base "$EVENT_BASE_SHA" \
                --event-base-ref "$EVENT_BASE_REF" \
                --expected-auto-merge disabled \
                >"$RUNNER_TEMP/rollback-auto-merge-proof.log" 2>&1
              proof_result=$?
              set -e
              if (( proof_result != 0 )); then
                cat "$RUNNER_TEMP/rollback-auto-merge.log" >&2
                cat "$RUNNER_TEMP/rollback-auto-merge-proof.log" >&2
                printf 'Unable to prove that the leased open PR remained unmerged and Auto-merge was disarmed (%d).\n' \
                  "$disable_result" >&2
                exit 1
              fi
            fi
            exit "$result"
          }
          trap 'rollback_unverified_auto_merge $?' EXIT
          ci/prove-auto-merge-state.py \
            --repo "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --event-head "$EVENT_HEAD_SHA" \
            --event-base "$EVENT_BASE_SHA" \
            --event-base-ref "$EVENT_BASE_REF" \
            --expected-auto-merge disabled
          ci/prove-default-branch-head.py \
            --repository "$GITHUB_REPOSITORY" \
            --event-base "$EVENT_BASE_SHA" \
            --event-base-ref "$EVENT_BASE_REF" \
            >"$RUNNER_TEMP/auto-merge-pre-arm-base-freshness.json"
          cat "$RUNNER_TEMP/auto-merge-pre-arm-base-freshness.json"
          ci/prove-required-context-active.py \
            --repository "$GITHUB_REPOSITORY" \
            --context configure \
            --ruleset-config .github/rulesets/main.json \
            >"$RUNNER_TEMP/auto-merge-pre-arm-activation.json"
          cat "$RUNNER_TEMP/auto-merge-pre-arm-activation.json"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --auto --squash --delete-branch
          ci/prove-auto-merge-state.py \
            --repo "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --event-head "$EVENT_HEAD_SHA" \
            --event-base "$EVENT_BASE_SHA" \
            --event-base-ref "$EVENT_BASE_REF" \
            --expected-auto-merge enabled
          armed_verified=true

# SPDX-License-Identifier: Apache-2.0
name: Auto Merge Policy

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited, labeled, unlabeled]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  configure:
    name: auto-merge-policy
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.author_association == 'OWNER' ||
       github.event.pull_request.author_association == 'MEMBER' ||
       github.event.pull_request.author_association == 'COLLABORATOR' ||
       github.event.pull_request.user.login == 'yinjiayi' ||
       github.event.pull_request.user.login == 'github-actions[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Disarm GitHub Auto-merge before evaluating the current head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          disable_result=0
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto \
            >"$RUNNER_TEMP/disable-auto.log" 2>&1 || disable_result=$?
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$EVENT_HEAD_SHA" \
            --arg base "$EVENT_BASE_SHA" \
            '.state == "open" and
             .merged == false and
             .merged_at == null and
             .head.sha == $head and
             .base.sha == $base and
             .head.repo.full_name == $repo and
             .base.repo.full_name == $repo' <<<"$current" >/dev/null
          test "$(jq -r .head.sha <<<"$current")" = "$EVENT_HEAD_SHA"
          test "$(jq -r .base.sha <<<"$current")" = "$EVENT_BASE_SHA"
          test "$(jq -r .head.repo.full_name <<<"$current")" = "$GITHUB_REPOSITORY"
          test "$(jq -r .base.repo.full_name <<<"$current")" = "$GITHUB_REPOSITORY"
          if [[ $(jq -r '.auto_merge == null' <<<"$current") != true ]]; then
            cat "$RUNNER_TEMP/disable-auto.log" >&2
            printf 'Auto-merge remains armed after the mandatory disarm operation.\n' >&2
            exit 1
          fi
          if (( disable_result != 0 )); then
            printf 'Disable command returned %d, but API readback proves auto-merge is off.\n' \
              "$disable_result"
          fi
      - name: Check out the immutable protected-base policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Evaluate exact current scope from complete API file evidence
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ ! -x ci/evaluate-auto-merge.py ]]; then
            jq -n \
              --arg head "$EVENT_HEAD_SHA" \
              --arg base "$EVENT_BASE_SHA" \
              '{
                schema_version: 1,
                status: "blocked",
                eligible: false,
                package_id: "",
                head_sha: $head,
                base_sha: $base,
                changed_files: [],
                reasons: ["protected-base policy predates evaluator"]
              }' >"$RUNNER_TEMP/auto-merge-policy.json"
            printf 'eligible=false\npackage_id=\n' >>"$GITHUB_OUTPUT"
            jq . "$RUNNER_TEMP/auto-merge-policy.json"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            >"$RUNNER_TEMP/auto-merge-pr.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            >"$RUNNER_TEMP/auto-merge-files.json"
          ci/evaluate-auto-merge.py \
            --pr-json "$RUNNER_TEMP/auto-merge-pr.json" \
            --files-json "$RUNNER_TEMP/auto-merge-files.json" \
            --repo "$GITHUB_REPOSITORY" \
            --event-head "$EVENT_HEAD_SHA" \
            --event-base "$EVENT_BASE_SHA" \
            --output "$RUNNER_TEMP/auto-merge-policy.json" \
            --github-output "$GITHUB_OUTPUT"
          jq . "$RUNNER_TEMP/auto-merge-policy.json"
      - name: Arm GitHub Auto-merge only for the leased single-package head
        if: steps.policy.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          armed_verified=false
          rollback_unverified_auto_merge() {
            result=$1
            trap - EXIT
            if [[ "$armed_verified" != true ]]; then
              set +e
              gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto \
                >"$RUNNER_TEMP/rollback-auto-merge.log" 2>&1
              disable_result=$?
              rollback_current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
                2>"$RUNNER_TEMP/rollback-auto-merge-api.log")
              read_result=$?
              set -e
              if (( read_result != 0 )) || ! jq -e \
                   --arg repo "$GITHUB_REPOSITORY" \
                   --arg head "$EVENT_HEAD_SHA" \
                   --arg base "$EVENT_BASE_SHA" \
                   '.state == "open" and
                    .merged == false and
                    .merged_at == null and
                    .head.sha == $head and
                    .base.sha == $base and
                    .head.repo.full_name == $repo and
                    .base.repo.full_name == $repo and
                    .auto_merge == null' <<<"$rollback_current" >/dev/null; then
                cat "$RUNNER_TEMP/rollback-auto-merge.log" >&2
                cat "$RUNNER_TEMP/rollback-auto-merge-api.log" >&2
                printf 'Unable to prove that the leased open PR remained unmerged and Auto-merge was disarmed (%d).\n' \
                  "$disable_result" >&2
                exit 1
              fi
            fi
            exit "$result"
          }
          trap 'rollback_unverified_auto_merge $?' EXIT
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$EVENT_HEAD_SHA" \
            --arg base "$EVENT_BASE_SHA" \
            '.state == "open" and
             .merged == false and
             .merged_at == null and
             .head.sha == $head and
             .base.sha == $base and
             .head.repo.full_name == $repo and
             .base.repo.full_name == $repo and
             .auto_merge == null' <<<"$current" >/dev/null
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --auto --squash --delete-branch
          after=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$EVENT_HEAD_SHA" \
            --arg base "$EVENT_BASE_SHA" \
            '.state == "open" and
             .merged == false and
             .merged_at == null and
             .head.sha == $head and
             .base.sha == $base and
             .head.repo.full_name == $repo and
             .base.repo.full_name == $repo and
             .auto_merge != null' <<<"$after" >/dev/null
          armed_verified=true

# SPDX-License-Identifier: Apache-2.0
name: Package CI

on:
  push:
    branches: [main]
    paths:
      - packages/**
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  workflow_call:
    inputs:
      package_id:
        description: Canonical package selected by the trusted backfill planner
        required: true
        type: string
      commit_sha:
        description: Exact protected-main commit to build
        required: true
        type: string
      publish_to_repo:
        description: Publish successful RPM and SRPM outputs
        required: true
        type: boolean
    secrets:
      RPM_REPO_SSH_PRIVATE_KEY:
        description: Restricted rrsync-only deployment key
        required: true
  workflow_dispatch:
    inputs:
      base_sha:
        description: Immutable default-branch base SHA for a trusted bot-created PR
        required: false
        type: string
      package_id:
        description: Optional existing package to rebuild at the selected main commit
        required: false
        type: string
      publish_to_repo:
        description: Publish successful package output to the supplemental RPM repository
        required: false
        default: false
        type: boolean

concurrency:
  group: package-ci-${{ inputs.package_id || github.event.pull_request.number || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ARTIFACT_RETENTION_DAYS: "7"
  TARGET_PLATFORM: linux/riscv64

jobs:
  prepare:
    name: change-scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      package_id: ${{ steps.scope.outputs.package_id }}
      needs_native: ${{ steps.policy.outputs.needs_native }}
      timeout_minutes: ${{ steps.policy.outputs.timeout_minutes }}
      build_user: ${{ steps.policy.outputs.build_user }}
    steps:
      - name: Check out the exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the diff
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base_sha }}
          HEAD_SHA: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          EXPLICIT_PACKAGE: ${{ inputs.package_id }}
        run: |
          mkdir -p artifacts/scope
          if [[ -n "$EXPLICIT_PACKAGE" ]]; then
            ci/select-package-scope.py \
              --package-id "$EXPLICIT_PACKAGE" --head "$HEAD_SHA" \
              --output artifacts/scope/change-scope.json \
              --github-output "$GITHUB_OUTPUT"
          else
            ci/detect-change-scope.py \
              --base "$BASE_SHA" --head "$HEAD_SHA" \
              --output artifacts/scope/change-scope.json \
              --github-output "$GITHUB_OUTPUT"
          fi
      - name: Read canonical package build profile
        id: policy
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          PACKAGE_ID: ${{ steps.scope.outputs.package_id }}
        run: |
          if [[ "$MODE" = package ]]; then
            ci/package-policy.py --package-dir "packages/$PACKAGE_ID" \
              --output artifacts/scope/package-policy.json \
              --github-output "$GITHUB_OUTPUT"
          else
            printf 'needs_native=false\ntimeout_minutes=120\nbuild_user=root\n' >>"$GITHUB_OUTPUT"
          fi
      - name: Record the fail-closed QEMU runner policy
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          NEEDS_NATIVE: ${{ steps.policy.outputs.needs_native }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          ci/qemu-runner-policy.py \
            --mode "$MODE" \
            --needs-native "$NEEDS_NATIVE" \
            --event-name "$EVENT_NAME" \
            --ref "$EVENT_REF" \
            --output artifacts/scope/qemu-runner-policy.json
      - name: Upload scope evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-ci-scope-${{ steps.scope.outputs.package_id }}-${{ github.run_id }}
          path: artifacts/scope/
          if-no-files-found: error
          retention-days: 7

  metadata-validate:
    name: metadata-validate
    needs: prepare
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          persist-credentials: false
      - name: Validate metadata and schemas
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
        run: |
          test "$PREPARE_RESULT" = success
          mkdir -p artifacts/metadata
          scripts/validate-metadata --repo-root . --schemas-dir schemas \
            --output artifacts/metadata/metadata-validation.json
          ci/validate-repository.py --repo-root . \
            --output artifacts/metadata/ci-static-validation.json
      - name: Upload metadata evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-ci-metadata-${{ needs.prepare.outputs.package_id }}-${{ github.run_id }}
          path: artifacts/metadata/
          if-no-files-found: warn
          retention-days: 7

  patch-policy:
    name: patch-policy
    needs: prepare
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          persist-credentials: false
      - name: Enforce patch ownership and application
        env:
          MODE: ${{ needs.prepare.outputs.mode }}
          PACKAGE_ID: ${{ needs.prepare.outputs.package_id }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
        run: |
          test "$PREPARE_RESULT" = success
          mkdir -p artifacts/patch-policy
          if [[ "$MODE" = package ]]; then
            ci/check-patch-policy.py --package-dir "packages/$PACKAGE_ID" \
              --output artifacts/patch-policy/patch-policy.json
          else
            python3 - <<'PY'
          import json
          from pathlib import Path
          Path("artifacts/patch-policy/patch-policy.json").write_text(
              json.dumps({"schema_version": 1, "status": "not-applicable", "reason": "infrastructure change"}, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          fi
      - name: Upload patch-policy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-ci-patch-policy-${{ needs.prepare.outputs.package_id }}-${{ github.run_id }}
          path: artifacts/patch-policy/
          if-no-files-found: warn
          retention-days: 7

  source-verify:
    name: source-verify
    needs: prepare
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          persist-credentials: false
      - name: Record source-stage environment
        run: ci/record-environment.sh artifacts/source/environment.json
      - name: Download and verify official release source
        env:
          MODE: ${{ needs.prepare.outputs.mode }}
          PACKAGE_ID: ${{ needs.prepare.outputs.package_id }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_COMMIT_SHA: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          test "$PREPARE_RESULT" = success
          mkdir -p artifacts/source
          if [[ "$MODE" = package ]]; then
            scripts/build-rpm --package-dir "packages/$PACKAGE_ID" \
              --repo-root . \
              --work-dir "work/$PACKAGE_ID" \
              --result artifacts/source/source-phase-result.json \
              --commit-sha "$BUILD_COMMIT_SHA" \
              --verify-only --expected-arch riscv64
          else
            python3 - <<'PY'
          import json
          from pathlib import Path
          Path("artifacts/source/not-applicable.json").write_text(
              json.dumps({"schema_version": 1, "kind": "not-applicable", "check": "source-verify", "reason": "infrastructure change"}, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          fi
      - name: Upload verified sources and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-ci-source-${{ needs.prepare.outputs.package_id }}-${{ github.run_id }}
          path: |
            artifacts/source/
            work/${{ needs.prepare.outputs.package_id }}/SOURCES/
            work/${{ needs.prepare.outputs.package_id }}/source-verification.json
          if-no-files-found: warn
          retention-days: 7

  repository-snapshot:
    name: repository-snapshot
    needs: prepare
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository client at the exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          persist-credentials: false
      - name: Resolve one immutable supplemental repository generation
        env:
          MODE: ${{ needs.prepare.outputs.mode }}
          NEEDS_NATIVE: ${{ needs.prepare.outputs.needs_native }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
        run: |
          test "$PREPARE_RESULT" = success
          mkdir -p artifacts/repository
          if [[ "$MODE" = package && "$NEEDS_NATIVE" != true ]]; then
            ci/rpm-repo-client.py resolve \
              --state-url http://2.27.148.101:38080/state.json \
              --repo-file artifacts/repository/openeuler-riscv-project.repo \
              --output artifacts/repository/resolution.json
          else
            printf '%s\n' '{"schema_version":1,"kind":"not-applicable","check":"repository-snapshot","reason":"no QEMU package build is in scope"}' \
              > artifacts/repository/not-applicable.json
          fi
      - name: Upload immutable repository evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-ci-repository-${{ needs.prepare.outputs.package_id }}-${{ github.run_id }}
          path: artifacts/repository/
          if-no-files-found: error
          retention-days: 7

  merge-policy:
    name: merge-policy
    needs: prepare
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Record native-routing or mergeable policy
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          MODE: ${{ needs.prepare.outputs.mode }}
          PACKAGE_ID: ${{ needs.prepare.outputs.package_id }}
          NEEDS_NATIVE: ${{ needs.prepare.outputs.needs_native }}
        run: |
          test "$PREPARE_RESULT" = success
          mkdir -p artifacts/merge-policy
          if [[ "$MODE" = package && "$NEEDS_NATIVE" = true ]]; then
            python3 - "$PACKAGE_ID" <<'PY'
          import json
          import sys
          from pathlib import Path
          Path("artifacts/merge-policy/result.json").write_text(
              json.dumps({
                  "schema_version": 1,
                  "package_id": sys.argv[1],
                  "phase": "merge-policy",
                  "status": "needs-native-riscv",
                  "classification": "needs-native-riscv",
                  "message": "Native RISC-V validation is required and no self-hosted runner is enabled.",
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
            exit 1
          fi
          printf '%s\n' '{"schema_version":1,"phase":"merge-policy","status":"passed"}' \
            > artifacts/merge-policy/result.json
      - name: Upload merge-policy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-ci-merge-policy-${{ github.run_id }}
          path: artifacts/merge-policy/
          if-no-files-found: warn
          retention-days: 7

  rpmbuild-riscv64:
    name: rpmbuild-riscv64
    needs: [prepare, metadata-validate, patch-policy, source-verify, repository-snapshot]
    if: always()
    # Public pull-request and merge-queue workflows stay on a disposable
    # GitHub-hosted VM.  The repository-level pool is reachable only from a
    # protected-main push or workflow_dispatch after the hosted prepare job
    # has proven that one QEMU-buildable package is in scope.
    runs-on: ${{ fromJSON(needs.prepare.outputs.mode == 'package' && needs.prepare.outputs.needs_native != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && '["self-hosted","linux","x64","oe-rva23-qemu"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 120
    steps:
      - name: Check out the exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          persist-credentials: false
      - name: Download verified sources
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-ci-source-${{ needs.prepare.outputs.package_id }}-${{ github.run_id }}
          path: .
      - name: Download the verified immutable repository configuration
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-ci-repository-${{ needs.prepare.outputs.package_id }}-${{ github.run_id }}
          path: artifacts/repository
      - name: Record build environment
        run: ci/record-environment.sh artifacts/build/environment.json
      - name: Check prerequisite results
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          METADATA_RESULT: ${{ needs.metadata-validate.result }}
          PATCH_RESULT: ${{ needs.patch-policy.result }}
          SOURCE_RESULT: ${{ needs.source-verify.result }}
          REPOSITORY_RESULT: ${{ needs.repository-snapshot.result }}
        run: |
          test "$PREPARE_RESULT" = success
          test "$METADATA_RESULT" = success
          test "$PATCH_RESULT" = success
          test "$SOURCE_RESULT" = success
          test "$REPOSITORY_RESULT" = success
      - name: Install RISC-V QEMU/binfmt
        if: needs.prepare.outputs.mode == 'package' && needs.prepare.outputs.needs_native != 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: riscv64
          image: tonistiigi/binfmt:qemu-v9.2.0
      - name: Resolve and anonymously pull the immutable image
        if: needs.prepare.outputs.mode == 'package' && needs.prepare.outputs.needs_native != 'true'
        id: image
        run: |
          ref=$(ci/image-ref.sh ci/image.lock)
          printf 'ref=%s\n' "$ref" >>"$GITHUB_OUTPUT"
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker pull --platform linux/riscv64 "$ref"
          docker run --rm --platform linux/riscv64 --memory 1g --cpus 2 --pids-limit 256 \
            "$ref" /usr/local/bin/verify-target
      - name: Resolve and install audited BuildRequires in an ephemeral image
        if: needs.prepare.outputs.mode == 'package' && needs.prepare.outputs.needs_native != 'true'
        id: dependencies
        env:
          PACKAGE_ID: ${{ needs.prepare.outputs.package_id }}
          BASE_IMAGE: ${{ steps.image.outputs.ref }}
          BUILD_USER: ${{ needs.prepare.outputs.build_user }}
        run: |
          mkdir -p artifacts/build/dependencies
          derived="openeuler-builddeps:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          set +e
          ci/run-capped.sh --log artifacts/build/dependencies/install.log \
            --max-bytes 52428800 --timeout-seconds 1800 -- \
            ci/prepare-build-deps.py --base-image "$BASE_IMAGE" \
              --package-dir "packages/$PACKAGE_ID" \
              --work-dir "work/$PACKAGE_ID" \
              --output artifacts/build/dependencies/result.json \
              --derived-tag "$derived" \
              --supplemental-repo-file artifacts/repository/openeuler-riscv-project.repo \
              --supplemental-evidence artifacts/repository/resolution.json \
              --build-user "$BUILD_USER"
          dependency_status=$?
          set -e
          if ((dependency_status != 0)); then
            python3 - "$PACKAGE_ID" "$dependency_status" <<'PY'
          import json
          import sys
          from pathlib import Path
          Path("artifacts/build/dependencies/failure.json").write_text(json.dumps({
              "schema_version": 1,
              "package_id": sys.argv[1],
              "phase": "dependency-prepare",
              "status": "failed",
              "exit_code": int(sys.argv[2]),
              "message": "Audited BuildRequires preparation failed; see install.log.",
          }, indent=2) + "\n", encoding="utf-8")
          PY
            scripts/classify-failure \
              --input artifacts/build/dependencies/failure.json \
              --log artifacts/build/dependencies/install.log \
              --output artifacts/build/failure.json \
              --package-dir "packages/$PACKAGE_ID" || true
            exit "$dependency_status"
          fi
          printf 'image=%s\n' "$derived" >>"$GITHUB_OUTPUT"
      - name: Build SRPM and RPM without network
        if: needs.prepare.outputs.mode == 'package' && needs.prepare.outputs.needs_native != 'true'
        env:
          PACKAGE_ID: ${{ needs.prepare.outputs.package_id }}
          IMAGE_REF: ${{ steps.dependencies.outputs.image }}
          BUILD_USER: ${{ needs.prepare.outputs.build_user }}
          BUILD_COMMIT_SHA: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          mkdir -p artifacts/build
          set +e
          ci/run-capped.sh --log artifacts/build/rpmbuild.log \
            --max-bytes 52428800 --timeout-seconds 6900 -- \
            ci/run-rpmbuild-container.py run \
              --image "$IMAGE_REF" \
              --package-id "$PACKAGE_ID" \
              --repo-root "$GITHUB_WORKSPACE" \
              --work-dir "$GITHUB_WORKSPACE/work/$PACKAGE_ID" \
              --artifact-dir "$GITHUB_WORKSPACE/artifacts/build" \
              --commit-sha "$BUILD_COMMIT_SHA" \
              --build-user "$BUILD_USER"
          result=$?
          if [[ -f "work/$PACKAGE_ID/logs/rpmbuild.log" ]]; then
            cp -- "work/$PACKAGE_ID/logs/rpmbuild.log" artifacts/build/rpmbuild-internal.log
          fi
          set -e
          if ((result != 0)); then
            classifier_args=(
              --input artifacts/build/rpmbuild-phase-result.json
              --output artifacts/build/failure.json
              --package-dir "packages/$PACKAGE_ID"
            )
            if [[ -f artifacts/build/rpmbuild-internal.log ]]; then
              classifier_args+=(--log artifacts/build/rpmbuild-internal.log)
            fi
            scripts/classify-failure "${classifier_args[@]}" || true
          fi
          exit "$result"
      - name: Record expected native RISC-V routing without QEMU build
        if: needs.prepare.outputs.mode == 'package' && needs.prepare.outputs.needs_native == 'true'
        env:
          PACKAGE_ID: ${{ needs.prepare.outputs.package_id }}
        run: |
          mkdir -p artifacts/build
          python3 - "$PACKAGE_ID" <<'PY'
          import json
          import sys
          from pathlib import Path
          Path("artifacts/build/native-routing.json").write_text(
              json.dumps({
                  "schema_version": 1,
                  "kind": "native-routing",
                  "package_id": sys.argv[1],
                  "phase": "native-routing",
                  "status": "needs-native-riscv",
                  "classification": "needs-native-riscv",
                  "exit_code": 0,
                  "message": "QEMU build intentionally skipped; native runner is not configured.",
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Record infrastructure-only result
        if: needs.prepare.outputs.mode == 'infrastructure'
        run: |
          mkdir -p artifacts/build
          printf '%s\n' '{"schema_version":1,"kind":"not-applicable","check":"rpmbuild-riscv64","reason":"infrastructure change"}' > artifacts/build/not-applicable.json
      - name: Stage upload-safe build evidence
        if: always()
        env:
          PACKAGE_ID: ${{ needs.prepare.outputs.package_id }}
        run: |
          ci/stage-build-artifacts.py \
            --package-id "$PACKAGE_ID" \
            --artifact-dir artifacts/build \
            --work-dir "work/$PACKAGE_ID" \
            --output-dir "$RUNNER_TEMP/package-ci-build-upload"
      - name: Upload build products and complete logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-ci-build-${{ needs.prepare.outputs.package_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/package-ci-build-upload/
          if-no-files-found: warn
          retention-days: 7

  rpm-install-smoke:
    name: rpm-install-smoke
    needs: [prepare, metadata-validate, patch-policy, source-verify, repository-snapshot, rpmbuild-riscv64]
    if: always()
    runs-on: ${{ fromJSON(needs.prepare.outputs.mode == 'package' && needs.prepare.outputs.needs_native != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && '["self-hosted","linux","x64","oe-rva23-qemu"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 30
    steps:
      - name: Check out the exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          persist-credentials: false
      - name: Download RISC-V build products
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-ci-build-${{ needs.prepare.outputs.package_id }}-${{ github.run_id }}
          path: .
      - name: Download the same immutable repository configuration
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-ci-repository-${{ needs.prepare.outputs.package_id }}-${{ github.run_id }}
          path: artifacts/repository
      - name: Check build result
        env:
          BUILD_RESULT: ${{ needs.rpmbuild-riscv64.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
        run: |
          test "$PREPARE_RESULT" = success
          test "$BUILD_RESULT" = success
      - name: Install RISC-V QEMU/binfmt
        if: needs.prepare.outputs.mode == 'package' && needs.prepare.outputs.needs_native != 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: riscv64
          image: tonistiigi/binfmt:qemu-v9.2.0
      - name: Resolve immutable image
        if: needs.prepare.outputs.mode == 'package' && needs.prepare.outputs.needs_native != 'true'
        id: image
        run: |
          ref=$(ci/image-ref.sh ci/image.lock)
          printf 'ref=%s\n' "$ref" >>"$GITHUB_OUTPUT"
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker pull --platform linux/riscv64 "$ref"
          docker run --rm --platform linux/riscv64 --memory 1g --cpus 2 --pids-limit 256 \
            "$ref" /usr/local/bin/verify-target
      - name: Install RPM and run smoke test
        if: needs.prepare.outputs.mode == 'package' && needs.prepare.outputs.needs_native != 'true'
        env:
          PACKAGE_ID: ${{ needs.prepare.outputs.package_id }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          mkdir -p artifacts/smoke
          ci/run-capped.sh --log artifacts/smoke/smoke.log \
            --max-bytes 52428800 --timeout-seconds 1500 -- \
            docker run --rm --platform linux/riscv64 \
              --memory 6g --cpus 2 --pids-limit 1024 \
              --security-opt no-new-privileges \
              -v "$GITHUB_WORKSPACE/artifacts/repository/openeuler-riscv-project.repo:/etc/yum.repos.d/openeuler-riscv-project.repo:ro" \
              -v "$GITHUB_WORKSPACE:/workspace:ro" \
              -v "$GITHUB_WORKSPACE/work/$PACKAGE_ID:/workspace/work/$PACKAGE_ID:rw" \
              -v "$GITHUB_WORKSPACE/artifacts/smoke:/workspace/artifacts/smoke:rw" \
              -w /workspace "$IMAGE_REF" \
              ci/install-smoke.sh "packages/$PACKAGE_ID" "work/$PACKAGE_ID" \
                artifacts/smoke/smoke-phase-result.json
      - name: Record expected native RISC-V smoke routing
        if: needs.prepare.outputs.mode == 'package' && needs.prepare.outputs.needs_native == 'true'
        env:
          PACKAGE_ID: ${{ needs.prepare.outputs.package_id }}
        run: |
          mkdir -p artifacts/smoke
          python3 - "$PACKAGE_ID" <<'PY'
          import json
          import sys
          from pathlib import Path
          Path("artifacts/smoke/native-routing.json").write_text(
              json.dumps({
                  "schema_version": 1,
                  "kind": "native-routing",
                  "package_id": sys.argv[1],
                  "phase": "rpm-install-smoke",
                  "status": "needs-native-riscv",
                  "classification": "needs-native-riscv",
                  "message": "Install/kernel smoke requires a future native RISC-V runner.",
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Record infrastructure-only result
        if: needs.prepare.outputs.mode == 'infrastructure'
        run: |
          mkdir -p artifacts/smoke
          printf '%s\n' '{"schema_version":1,"kind":"not-applicable","check":"rpm-install-smoke","reason":"infrastructure change"}' > artifacts/smoke/not-applicable.json
      - name: Compose the final commit-bound build result
        if: always()
        env:
          MODE: ${{ needs.prepare.outputs.mode }}
          PACKAGE_ID: ${{ needs.prepare.outputs.package_id }}
          NEEDS_NATIVE: ${{ needs.prepare.outputs.needs_native }}
          COMMIT_SHA: ${{ inputs.commit_sha || github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          METADATA_RESULT: ${{ needs.metadata-validate.result }}
          SOURCE_RESULT: ${{ needs.source-verify.result }}
          PATCH_RESULT: ${{ needs.patch-policy.result }}
          RPMBUILD_RESULT: ${{ needs.rpmbuild-riscv64.result }}
          SMOKE_RESULT: ${{ job.status }}
        run: |
          mkdir -p artifacts/smoke
          if [[ "$MODE" != package ]]; then
            printf '%s\n' '{"schema_version":1,"kind":"not-applicable","check":"final-build-result","reason":"no single package build is in scope"}' \
              > artifacts/smoke/final-not-applicable.json
            exit 0
          fi
          args=(
            --package-id "$PACKAGE_ID"
            --commit-sha "$COMMIT_SHA"
            --job-id "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:package-ci"
            --image-lock ci/image.lock
            --metadata-result "$METADATA_RESULT"
            --source-result "$SOURCE_RESULT"
            --patch-result "$PATCH_RESULT"
            --rpmbuild-result "$RPMBUILD_RESULT"
            --smoke-result "$SMOKE_RESULT"
            --rpmbuild-phase artifacts/build/rpmbuild-phase-result.json
            --smoke-phase artifacts/smoke/smoke-phase-result.json
            --failure-classification artifacts/build/failure.json
            --artifact-reference "package-ci-source-${PACKAGE_ID}-${GITHUB_RUN_ID}"
            --artifact-reference "package-ci-repository-${PACKAGE_ID}-${GITHUB_RUN_ID}"
            --artifact-reference "package-ci-build-${PACKAGE_ID}-${GITHUB_RUN_ID}"
            --artifact-reference "package-ci-smoke-${PACKAGE_ID}-${GITHUB_RUN_ID}"
            --output artifacts/smoke/build-result.json
          )
          if [[ "$NEEDS_NATIVE" = true ]]; then
            args+=(--needs-native)
          fi
          if [[ -n "$PR_NUMBER" ]]; then
            args+=(--pr-number "$PR_NUMBER")
          fi
          ci/compose-build-result.py "${args[@]}"
      - name: Upload installation and test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-ci-smoke-${{ needs.prepare.outputs.package_id }}-${{ github.run_id }}
          path: artifacts/smoke/
          if-no-files-found: warn
          retention-days: 7

  publish-rpm-repository:
    name: publish-rpm-repository
    needs: [prepare, rpmbuild-riscv64, rpm-install-smoke]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.rpmbuild-riscv64.result == 'success' &&
      needs.rpm-install-smoke.result == 'success' &&
      needs.prepare.outputs.mode == 'package' &&
      needs.prepare.outputs.needs_native != 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.publish_to_repo)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out trusted publishing code at the built commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          persist-credentials: false
      - name: Download sanitized RPM and SRPM products
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-ci-build-${{ needs.prepare.outputs.package_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/rpm-repo-build
      - name: Stage one checksum-bound upload batch
        id: stage
        env:
          PACKAGE_ID: ${{ needs.prepare.outputs.package_id }}
          COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
        run: |
          mkdir -p artifacts/repository-publish
          generation=$(ci/stage-rpm-repository-upload.py \
            --artifact-root "$RUNNER_TEMP/rpm-repo-build" \
            --output-dir "$RUNNER_TEMP/rpm-repo-upload" \
            --package-id "$PACKAGE_ID" \
            --commit-sha "$COMMIT_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT")
          cp "$RUNNER_TEMP/rpm-repo-upload/publish-evidence.json" \
            artifacts/repository-publish/upload.json
          printf 'generation=%s\n' "$generation" >>"$GITHUB_OUTPUT"
      - name: Configure the restricted deployment identity
        env:
          RPM_REPO_SSH_PRIVATE_KEY: ${{ secrets.RPM_REPO_SSH_PRIVATE_KEY }}
        run: |
          test -n "$RPM_REPO_SSH_PRIVATE_KEY"
          install -d -m 0700 "$RUNNER_TEMP/rpm-repo-ssh"
          printf '%s\n' "$RPM_REPO_SSH_PRIVATE_KEY" \
            > "$RUNNER_TEMP/rpm-repo-ssh/id_ed25519"
          chmod 0600 "$RUNNER_TEMP/rpm-repo-ssh/id_ed25519"
          cp ci/rpm-repo-known-hosts "$RUNNER_TEMP/rpm-repo-ssh/known_hosts"
          chmod 0644 "$RUNNER_TEMP/rpm-repo-ssh/known_hosts"
          expected=$(awk 'NR == 1 {print $2}' ops/rpm-repo-server/deploy-key.pub)
          actual=$(ssh-keygen -y -f "$RUNNER_TEMP/rpm-repo-ssh/id_ed25519" | awk '{print $2}')
          test "$actual" = "$expected"
      - name: Upload RPMs first and the ready marker last
        env:
          GENERATION: ${{ steps.stage.outputs.generation }}
          RRSYNC_LOCK_JITTER_KEY: ${{ format('{0}:{1}', github.run_id, needs.prepare.outputs.package_id) }}
        run: |
          ssh_transport="ssh -p 38022 -i $RUNNER_TEMP/rpm-repo-ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/rpm-repo-ssh/known_hosts"
          ci/rsync-with-lock-retry.sh -- rsync -r -e "$ssh_transport" \
            "$RUNNER_TEMP/rpm-repo-upload/payload/" \
            "reposync@2.27.148.101:$GENERATION/"
          ci/rsync-with-lock-retry.sh -- rsync -r -e "$ssh_transport" \
            "$RUNNER_TEMP/rpm-repo-upload/.ready" \
            "reposync@2.27.148.101:$GENERATION/.ready"
      - name: Verify the immutable public generation
        env:
          GENERATION: ${{ steps.stage.outputs.generation }}
          PACKAGE_ID: ${{ needs.prepare.outputs.package_id }}
          COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
        run: |
          state_url="http://2.27.148.101:38080/generations/$GENERATION/state.json"
          for attempt in $(seq 1 60); do
            printf 'publication verification attempt %s/60\n' "$attempt"
            if ci/rpm-repo-client.py verify-generation \
              --state-url "$state_url" \
              --expected-generation "$GENERATION" \
              --expected-package "$PACKAGE_ID" \
              --expected-commit "$COMMIT_SHA" \
              --output artifacts/repository-publish/result.json; then
              exit 0
            fi
            sleep 5
          done
          printf '%s\n' '{"schema_version":1,"kind":"rpm-repository-publication-verification","status":"failed","reason":"generation was not publicly verifiable within 300 seconds"}' \
            > artifacts/repository-publish/result.json
          exit 1
      - name: Upload repository publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpm-repository-publish-${{ needs.prepare.outputs.package_id }}-${{ github.run_id }}
          path: artifacts/repository-publish/
          if-no-files-found: warn
          retention-days: 7

  ci-state:
    name: record-ci-state
    needs: [prepare, metadata-validate, source-verify, patch-policy, repository-snapshot, merge-policy, rpmbuild-riscv64, rpm-install-smoke]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out trusted state-transition code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Download all structured results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-ci-*-${{ github.run_id }}
          path: artifacts/all-results
          merge-multiple: true
      - name: Label only a current trusted internal PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARTIFACT_DIR: artifacts/all-results
          OVERALL_RESULT: ${{ needs.prepare.result == 'success' && needs.metadata-validate.result == 'success' && needs.source-verify.result == 'success' && needs.patch-policy.result == 'success' && needs.repository-snapshot.result == 'success' && needs.merge-policy.result == 'success' && needs.rpmbuild-riscv64.result == 'success' && needs.rpm-install-smoke.result == 'success' && 'success' || 'failure' }}
        run: ci/label-ci-result.sh

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openeuler-riscv-packages-tools"
version = "0.1.0"
description = "Deterministic tools for the openEuler RISC-V package repository"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}

[tool.ruff]
line-length = 100
target-version = "py39"
